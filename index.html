<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>길드 자리배치 자동화</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap');
:root{
  --bg:#0f1117;--panel:#171b28;--panel2:#1e2235;--border:#272d45;
  --accent:#4f8ef7;--purple:#a855f7;--gold:#f5c842;--green:#34d399;--red:#f87171;
  --text:#e2e8f0;--muted:#64748b;--muted2:#8899aa;
  --c-best:rgba(245,200,66,.22);--c-good:rgba(52,211,153,.14);
  --c-empty:rgba(255,255,255,.035);--c-bear1:rgba(79,142,247,.14);--c-bear2:rgba(168,85,247,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* 헤더 */
header{display:flex;align-items:center;justify-content:space-between;padding:11px 22px;
  background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:50}
.hdr-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.hdr-title span{color:var(--accent)}
.hdr-credit{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:272px 1fr;flex:1;min-height:0}

/* ── 사이드바 ── */
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.stabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stab{flex:1;padding:9px 0;font-size:11.5px;font-weight:700;background:none;border:none;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;
  font-family:'Noto Sans KR',sans-serif}
.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tpane{display:none;flex-direction:column;flex:1;overflow:hidden}
.tpane.on{display:flex}

/* 업로드 */
.upzone{margin:10px 11px 0;padding:12px 10px;border:1.5px dashed var(--border);border-radius:9px;
  text-align:center;cursor:pointer;transition:.2s;background:var(--c-empty)}
.upzone:hover,.upzone.dov{border-color:var(--accent);background:rgba(79,142,247,.07)}
.upzone input{display:none}
.upzone .uico{font-size:17px;margin-bottom:3px}
.upzone .ulbl{font-size:11px;font-weight:700}
.upzone .usub{font-size:9px;color:var(--muted);margin-top:1px}

/* 멤버 리스트 */
.mlist{flex:1;overflow-y:auto;padding:8px 11px}
.mlist::-webkit-scrollbar{width:3px}
.mlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mitem{display:flex;align-items:center;gap:6px;padding:6px 9px;margin-bottom:3px;
  background:var(--c-empty);border-radius:7px;border:1px solid var(--border);
  cursor:grab;user-select:none;transition:.15s}
.mitem:hover{border-color:var(--accent);background:rgba(79,142,247,.07)}
.mitem.drag{opacity:.3}
.mitem.placed{opacity:.42;border-style:dashed;cursor:default}
.bbadge{width:22px;height:17px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}
.bb1{background:rgba(79,142,247,.22);color:var(--accent)}
.bb2{background:rgba(168,85,247,.22);color:var(--purple)}
.bba{background:rgba(100,116,139,.2);color:var(--muted)}
.mname{font-size:11px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtier{font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;flex-shrink:0}

/* 로그 */
.logpane{flex:1;overflow-y:auto;padding:10px 11px;font-family:'JetBrains Mono',monospace;
  font-size:9.5px;line-height:1.9;color:var(--muted)}
.logpane::-webkit-scrollbar{width:3px}
.logpane::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.lok{color:var(--green)}.lwarn{color:var(--gold)}.lerr{color:var(--red)}.linfo{color:var(--accent)}

/* 버튼 */
.brow{display:flex;gap:6px;padding:9px 11px;border-top:1px solid var(--border);flex-shrink:0}
.btn{flex:1;padding:8px 0;border-radius:7px;border:none;font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:.15s}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#3a7de8}
.bp:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.bs{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.bs:hover{border-color:var(--accent)}

/* ── 그리드 영역 ── */
.garea{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.gtbar{display:flex;align-items:center;gap:8px;padding:8px 16px;
  border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.gtlbl{font-size:10.5px;color:var(--muted);font-weight:700}
.legend{display:flex;gap:9px;margin-left:auto}
.lgit{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted)}
.ldot{width:8px;height:8px;border-radius:2px}

.gscroll{flex:1;overflow:auto;padding:16px}
.gscroll::-webkit-scrollbar{width:5px;height:5px}
.gscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* CSS 그리드: 11열×8행 */
.sgrid{
  display:grid;
  grid-template-columns:repeat(11,68px);
  grid-template-rows:repeat(8,56px);
  gap:5px;
  width:fit-content;
}

/* 슬롯 */
.slot{border-radius:7px;border:1.5px solid var(--border);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;position:relative;
  transition:.15s;overflow:hidden;padding:3px;cursor:pointer;font-weight:700}
.slot:hover{border-color:var(--accent)}
.slot.dov{border-color:var(--accent)!important;background:rgba(79,142,247,.18)!important;transform:scale(1.05)}
.slot.q-best{background:var(--c-best);border-color:rgba(245,200,66,.45)}
.slot.q-good{background:var(--c-good);border-color:rgba(52,211,153,.35)}
.slot.q-norm{background:var(--c-empty)}
.slot.q-empty{background:var(--c-empty)}
.sname{font-size:10px;line-height:1.2;word-break:break-all}
.stier{font-size:8.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:1px}
.sdot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%}
.sd1{background:var(--accent)}.sd2{background:var(--purple)}
.srm{position:absolute;top:1px;left:2px;font-size:8.5px;color:var(--muted);
  cursor:pointer;opacity:0;transition:.15s;line-height:1;z-index:5}
.slot:hover .srm{opacity:1}
.srm:hover{color:var(--red)!important}

/* ── 곰덫 ──
   행 mapping: 3→1,5→2,7→3,9→4,11→5,13→6,15→7,17→8
   열 mapping: C→1,E→2,G→3,I→4,K→5,M→6,O→7,Q→8,S→9,U→10,W→11
   곰덫1(H11:J13): G(3)~I(4) 사이 공간, 행11(5)~행13(6) → col3/5, row5/7
   곰덫2(Q11:S13): Q(8)~S(9) 자리, 행11(5)~행13(6) → col8/10, row5/7
   ※ 행9(row4)에 G9,I9 슬롯이 있으므로 row는 5/7이어야 함
*/
.btrap{border-radius:9px;border:2px solid;display:grid;
  grid-template-areas:'top top top' 'left center right' 'bot bot bot';
  grid-template-columns:22px 1fr 22px;
  grid-template-rows:22px 1fr 22px;
  position:relative}
#bt1{grid-column:3/5;grid-row:5/7;border-color:rgba(79,142,247,.45);background:linear-gradient(135deg,rgba(79,142,247,.16),rgba(79,142,247,.05))}
#bt2{grid-column:8/10;grid-row:5/7;border-color:rgba(168,85,247,.45);background:linear-gradient(135deg,rgba(168,85,247,.16),rgba(168,85,247,.05))}

/* 곰덫 내부 */
.btcenter{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none}
.bticon{font-size:15px}
.btlbl{font-size:10px;font-weight:900;letter-spacing:.5px}
#bt1 .btlbl{color:var(--accent)}
#bt2 .btlbl{color:var(--purple)}

/* 깃발 버튼 (4면) */
.fbtn{display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:4px;transition:.15s;background:none;border:none;font-size:11px;
  color:var(--muted);opacity:.45}
.fbtn:hover{opacity:.8}
.fbtn.active{opacity:1;color:var(--gold)}
.fbtop{grid-area:top}
.fblft{grid-area:left}
.fbrgt{grid-area:right}
.fbbot{grid-area:bot}

/* 통계바 */
.sbar{display:flex;align-items:center;gap:14px;padding:7px 16px;
  border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.sstat{display:flex;align-items:center;gap:4px;font-size:10.5px}
.sval{font-weight:700;font-family:'JetBrains Mono',monospace}
.sv1{color:var(--accent)}.sv2{color:var(--purple)}.svw{color:var(--gold)}
.btnexp{background:#064e3b;color:var(--green);border:1px solid #065f46;padding:6px 16px;
  border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:.15s;margin-left:auto}
.btnexp:hover{background:#047857}
.btnexp:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}

/* 드래그 고스트 */
#ghost{position:fixed;pointer-events:none;z-index:9999;padding:5px 10px;
  background:var(--accent);color:#fff;border-radius:5px;font-size:11px;font-weight:700;
  display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(79,142,247,.45)}
</style>
</head>
<body>

<header>
  <div class="hdr-title">🏰 길드 <span>자리배치</span> 자동화</div>
  <div class="hdr-credit">제작자: 윤치치치</div>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="stabs">
      <button class="stab on" onclick="stab('members')">멤버 목록</button>
      <button class="stab"    onclick="stab('log')">로그</button>
    </div>

    <div class="tpane on" id="tp-members">
      <div class="upzone" id="uz" onclick="document.getElementById('fi').click()">
        <input type="file" id="fi" accept=".xlsx,.xls" onchange="loadFile(this)">
        <div class="uico">📂</div>
        <div class="ulbl">멤버 목록 엑셀 업로드</div>
        <div class="usub">닉네임 · 지심층 · 곰덫 컬럼</div>
      </div>
      <div class="mlist" id="mlist"></div>
      <div class="brow">
        <button class="btn bp" id="btnA" onclick="runAssign()" disabled>▶ 자리 배치</button>
        <button class="btn bs"           onclick="resetAll()">↺ 초기화</button>
      </div>
    </div>

    <div class="tpane" id="tp-log">
      <div class="logpane" id="logp"></div>
      <div class="brow">
        <button class="btn bs" onclick="document.getElementById('logp').innerHTML=''">로그 지우기</button>
      </div>
    </div>
  </aside>

  <!-- 그리드 -->
  <main class="garea">
    <div class="gtbar">
      <span class="gtlbl">🗺 자리배치 그리드</span>
      <span id="gstatus" style="font-size:10.5px;color:var(--muted)">멤버 목록을 업로드하세요</span>
      <div class="legend">
        <div class="lgit"><div class="ldot" style="background:rgba(245,200,66,.65)"></div>최우선</div>
        <div class="lgit"><div class="ldot" style="background:rgba(52,211,153,.55)"></div>중간</div>
        <div class="lgit"><div class="ldot" style="background:rgba(255,255,255,.1)"></div>일반</div>
        <div class="lgit" style="margin-left:4px;border-left:1px solid var(--border);padding-left:8px">
          <div class="ldot" style="background:var(--gold);opacity:.7"></div>🚩 클릭해서 깃발 설정
        </div>
      </div>
    </div>

    <div class="gscroll">
      <div class="sgrid" id="sgrid">
        <!-- 곰덫 1 -->
        <div class="btrap" id="bt1">
          <button class="fbtn fbtop" data-trap="1" data-dir="up"    onclick="toggleFlag(this)" title="상단 깃발">🚩</button>
          <button class="fbtn fblft" data-trap="1" data-dir="left"  onclick="toggleFlag(this)" title="좌측 깃발">🚩</button>
          <div class="btcenter"><span class="bticon">🐻</span><span class="btlbl">곰덫 1</span></div>
          <button class="fbtn fbrgt" data-trap="1" data-dir="right" onclick="toggleFlag(this)" title="우측 깃발">🚩</button>
          <button class="fbtn fbbot" data-trap="1" data-dir="down"  onclick="toggleFlag(this)" title="하단 깃발">🚩</button>
        </div>
        <!-- 곰덫 2 -->
        <div class="btrap" id="bt2">
          <button class="fbtn fbtop" data-trap="2" data-dir="up"    onclick="toggleFlag(this)" title="상단 깃발">🚩</button>
          <button class="fbtn fblft" data-trap="2" data-dir="left"  onclick="toggleFlag(this)" title="좌측 깃발">🚩</button>
          <div class="btcenter"><span class="bticon">🐻</span><span class="btlbl">곰덫 2</span></div>
          <button class="fbtn fbrgt" data-trap="2" data-dir="right" onclick="toggleFlag(this)" title="우측 깃발">🚩</button>
          <button class="fbtn fbbot" data-trap="2" data-dir="down"  onclick="toggleFlag(this)" title="하단 깃발">🚩</button>
        </div>
      </div>
    </div>

    <div class="sbar">
      <div class="sstat">곰덫1 <span class="sval sv1" id="sb1">0</span>명</div>
      <div class="sstat">곰덫2 <span class="sval sv2" id="sb2">0</span>명</div>
      <div class="sstat">미배치 <span class="sval svw" id="sbu">0</span>명</div>
      <button class="btnexp" id="btnE" onclick="exportXL()" disabled>📥 엑셀 추출</button>
    </div>
  </main>
</div>

<div id="ghost"></div>

let members=[], placed={}, dragItem=null;

// 깃발: 각 곰덫에 최대 2개 방향
const flags = { '1': new Set(), '2': new Set() };

// 기본 깃발 (이미지 기준: 곰덫1=좌+하, 곰덫2=우+하)
function initDefaultFlags(){
  flags['1'].add('left'); flags['1'].add('down');
  flags['2'].add('right'); flags['2'].add('down');
  document.querySelectorAll('.fbtn').forEach(b=>{
    const t=b.dataset.trap, d=b.dataset.dir;
    if(flags[t].has(d)) b.classList.add('active');
  });
}

function stab(id){
  document.querySelectorAll('.stab').forEach((b,i)=>b.classList.toggle('on',['members','log'][i]===id));
  document.querySelectorAll('.tpane').forEach(p=>p.classList.remove('on'));
  document.getElementById('tp-'+id).classList.add('on');
}

function lg(msg,t=''){
  const el=document.getElementById('logp');
  const d=document.createElement('div');
  if(t) d.className='l'+t;
  d.textContent=msg; el.appendChild(d); el.scrollTop=el.scrollHeight;
}

// ═══════════════════════════════
// 점수 계산 (깃발 패널티 포함)
// ═══════════════════════════════
const FLAG_PENALTY = 12;
function score(s){
  const base = s.bear==='bear1' ? s.d1 : s.d2;
  const trapId = s.bear==='bear1' ? '1' : '2';
  const pen = flags[trapId].has(s.primaryDir) ? FLAG_PENALTY : 0;
  return base + pen;
}

// ═══════════════════════════════
// 깃발 토글
// ═══════════════════════════════
function toggleFlag(btn){
  const t=btn.dataset.trap, d=btn.dataset.dir;
  if(flags[t].has(d)){
    flags[t].delete(d);
    btn.classList.remove('active');
  } else {
    if(flags[t].size>=2){
      // 가장 먼저 추가된 것 제거
      const first=[...flags[t]][0];
      flags[t].delete(first);
      document.querySelector(`.fbtn[data-trap="${t}"][data-dir="${first}"]`).classList.remove('active');
    }
    flags[t].add(d);
    btn.classList.add('active');
  }
  // 배치된 상태면 색상만 재계산
  if(Object.keys(placed).length) recolorSlots();
}

// ═══════════════════════════════
// 파일 로드
// ═══════════════════════════════
function loadFile(inp){
  const file=inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      parseRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),file.name);
    }catch(err){lg('[오류] '+err.message,'err');}
  };
  r.readAsBinaryString(file);
}

function parseRows(rows,fname){
  if(!rows.length){lg('[오류] 빈 파일','err');return;}
  const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
  let ni=-1,ti=-1,bi=-1;
  hdr.forEach((h,i)=>{
    if(['닉네임','이름','닉','name'].some(k=>h.includes(k))) ni=i;
    else if(['지심','층','tier'].some(k=>h.includes(k))) ti=i;
    else if(['곰','bear'].some(k=>h.includes(k))) bi=i;
  });
  if(ni<0||ti<0){lg('[오류] 닉네임/지심층 컬럼을 찾을 수 없습니다.','err');return;}

  members=[]; let wc=0;
  for(let i=1;i<rows.length;i++){
    const row=rows[i]; if(!row.some(v=>v!=='')) continue;
    const name=String(row[ni]||'').trim();
    if(!name){lg(`행${i+1}: 닉네임 없음 → 건너뜀`,'warn');wc++;continue;}
    const tn=parseFloat(String(row[ti]||'').replace(/,/g,''));
    const tier=isNaN(tn)?0:Math.floor(tn);
    if(isNaN(tn)){lg(`행${i+1} [${name}]: 지심층 인식불가 → 0`,'warn');wc++;}
    const br=String(bi>=0?(row[bi]||''):'').trim();
    let bear=null;
    if(br.includes('1')) bear='bear1';
    else if(br.includes('2')) bear='bear2';
    else if(br&&br.toLowerCase()!=='none'&&br!=='-'){lg(`행${i+1} [${name}]: 곰덫값 '${br}' → 자동배정`,'warn');wc++;}
    members.push({name,tier,bear});
  }
  lg('─'.repeat(26),'info');
  lg(`✔ [${fname}] ${members.length}명 로드`,'ok');
  const b1=members.filter(m=>m.bear==='bear1').length;
  const b2=members.filter(m=>m.bear==='bear2').length;
  lg(`  곰1:${b1}  곰2:${b2}  미지정:${members.length-b1-b2}`,'info');
  const ts=members.map(m=>m.tier);
  lg(`  지심층: ${Math.min(...ts)} ~ ${Math.max(...ts)}`,'info');
  if(wc) lg(`  ⚠ 경고 ${wc}건`,'warn');

  const uz=document.getElementById('uz');
  uz.querySelector('.ulbl').textContent='✔ '+fname;
  uz.style.borderColor='var(--green)';
  document.getElementById('btnA').disabled=false;
  renderMList();
}

// ═══════════════════════════════
// 멤버 리스트 렌더
// ═══════════════════════════════
function renderMList(){
  const el=document.getElementById('mlist'); el.innerHTML='';
  members.forEach(m=>{
    const isP=Object.values(placed).some(p=>p.name===m.name);
    const div=document.createElement('div');
    div.className='mitem'+(isP?' placed':'');
    div.dataset.name=m.name; div.draggable=!isP;
    const bc=m.bear==='bear1'?'bb1':m.bear==='bear2'?'bb2':'bba';
    const bt=m.bear==='bear1'?'곰1':m.bear==='bear2'?'곰2':'자동';
    div.innerHTML=`<div class="bbadge ${bc}">${bt}</div>
      <div class="mname">${m.name}</div>
      <div class="mtier">${m.tier}</div>`;
    div.addEventListener('dragstart',e=>{
      if(isP){e.preventDefault();return;}
      dragItem={fromSlot:null,name:m.name,tier:m.tier,bear:m.bear};
      div.classList.add('drag'); showG(m.name); e.dataTransfer.effectAllowed='move';
    });
    div.addEventListener('dragend',()=>{div.classList.remove('drag');hideG();dragItem=null;});
    el.appendChild(div);
  });
}

// ═══════════════════════════════
// 자동 배치
// ═══════════════════════════════
function runAssign(){
  if(!members.length) return;
  placed={};
  const byTier=[...members].sort((a,b)=>b.tier-a.tier);
  const av1=SD.filter(s=>s.bear==='bear1').sort((a,b)=>score(a)-score(b));
  const av2=SD.filter(s=>s.bear==='bear2').sort((a,b)=>score(a)-score(b));
  const m1=byTier.filter(m=>m.bear==='bear1');
  const m2=byTier.filter(m=>m.bear==='bear2');
  const un=byTier.filter(m=>!m.bear);
  const r1=Math.max(0,av1.length-m1.length), r2=Math.max(0,av2.length-m2.length), rt=r1+r2;
  const f1=rt>0?Math.min(Math.round(un.length*r1/rt),r1):0;
  const fm1=[...m1,...un.slice(0,f1)];
  const fm2=[...m2,...un.slice(f1)];
  const ov=[];
  fm1.forEach((m,i)=>{ if(i<av1.length) placed[av1[i].key]={name:m.name,tier:m.tier,bear:'bear1'}; else ov.push(m.name); });
  fm2.forEach((m,i)=>{ if(i<av2.length) placed[av2[i].key]={name:m.name,tier:m.tier,bear:'bear2'}; else ov.push(m.name); });
  renderGrid(); renderMList(); updStats();
  lg('─'.repeat(26),'info');
  lg(`✔ 배치 완료: ${Object.keys(placed).length}명`,'ok');
  const p1=Object.values(placed).filter(p=>p.bear==='bear1').length;
  const p2=Object.values(placed).filter(p=>p.bear==='bear2').length;
  lg(`  곰1:${p1}  곰2:${p2}`,'info');
  if(ov.length) lg(`  ⚠ 미배치: ${ov.join(', ')}`,'warn');
  document.getElementById('btnE').disabled=false;
  stab('log');
}

// ═══════════════════════════════
// 그리드 렌더 / 색상 갱신
// ═══════════════════════════════
function qClass(s,p){
  if(!p) return 'q-empty';
  const sc=score(s);
  return sc<=4?'q-best':sc<=8?'q-good':'q-norm';
}

function renderGrid(){
  const grid=document.getElementById('sgrid');
  grid.querySelectorAll('.slot').forEach(e=>e.remove());
  SD.forEach(s=>{
    const p=placed[s.key];
    const el=document.createElement('div');
    el.className='slot '+qClass(s,p);
    el.dataset.key=s.key;
    el.style.gridColumn=String(s.cssCol);
    el.style.gridRow=String(s.cssRow);
    if(p){
      const dot=`<div class="sdot ${p.bear==='bear1'?'sd1':'sd2'}"></div>`;
      const rm=`<span class="srm" onclick="rmSlot('${s.key}',event)">✕</span>`;
      el.innerHTML=`${dot}${rm}<div class="sname">${p.name}</div><div class="stier">${p.tier}</div>`;
      el.draggable=true;
      el.addEventListener('dragstart',e=>{
        dragItem={fromSlot:s.key,name:p.name,tier:p.tier,bear:p.bear};
        showG(p.name); e.dataTransfer.effectAllowed='move';
      });
      el.addEventListener('dragend',()=>{hideG();dragItem=null;});
    } else {
      el.innerHTML=`<div style="font-size:7.5px;color:var(--muted);opacity:.3">${score(s).toFixed(1)}</div>`;
    }
    el.addEventListener('dragover',e=>{e.preventDefault();if(!dragItem)return;el.classList.add('dov');});
    el.addEventListener('dragleave',()=>el.classList.remove('dov'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dov');if(!dragItem)return;dropOn(s.key);});
    grid.appendChild(el);
  });
  updStats();
}

function recolorSlots(){
  // 전체 재렌더 (점수 재계산 포함)
  renderGrid();
  // 깃발 변경 후 배치 순서도 조정 가능성 있으므로 안내
  updStats();
}

function dropOn(tk){
  if(!dragItem) return;
  const {fromSlot,name,tier,bear}=dragItem;
  const prev=placed[tk];
  placed[tk]={name,tier,bear};
  if(fromSlot){
    if(prev) placed[fromSlot]=prev; else delete placed[fromSlot];
  } else {
    Object.keys(placed).forEach(k=>{if(k!==tk&&placed[k].name===name)delete placed[k];});
  }
  renderGrid(); renderMList(); updStats();
}

function rmSlot(key,e){
  e.stopPropagation();
  if(placed[key]){delete placed[key];renderGrid();renderMList();updStats();}
}

// ═══════════════════════════════
// 통계
// ═══════════════════════════════
function updStats(){
  const vals=Object.values(placed);
  document.getElementById('sb1').textContent=vals.filter(p=>p.bear==='bear1').length;
  document.getElementById('sb2').textContent=vals.filter(p=>p.bear==='bear2').length;
  const un=members.filter(m=>!Object.values(placed).some(p=>p.name===m.name)).length;
  document.getElementById('sbu').textContent=un;
  document.getElementById('gstatus').textContent=`${vals.length}명 배치됨`;
}

// ═══════════════════════════════
// 드래그 고스트
// ═══════════════════════════════
function showG(n){const g=document.getElementById('ghost');g.textContent=n;g.style.display='block';}
function hideG(){document.getElementById('ghost').style.display='none';}
document.addEventListener('mousemove',e=>{
  const g=document.getElementById('ghost');
  if(g.style.display==='block'){g.style.left=(e.clientX+12)+'px';g.style.top=(e.clientY+8)+'px';}
});

// 업로드존 파일 드랍
const uz=document.getElementById('uz');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('dov');});
uz.addEventListener('dragleave',()=>uz.classList.remove('dov'));
uz.addEventListener('drop',e=>{
  e.preventDefault();uz.classList.remove('dov');
  const f=e.dataTransfer.files[0];if(f)loadFile({files:[f]});
});

// ═══════════════════════════════
// 엑셀 추출
// ═══════════════════════════════
function exportXL(){
  if(!Object.keys(placed).length) return;
  const maxRow=18,maxCol=24;
  const data=Array.from({length:maxRow},()=>Array(maxCol).fill(null));
  Object.entries(placed).forEach(([key,p])=>{
    const s=SM[key];if(!s)return;
    data[s.excelRow-1][s.excelCol.charCodeAt(0)-65]=p.name;
  });
  data[10][7]='곰덫1'; data[10][16]='곰덫2';
  // 활성 깃발 표시
  const flagCells={
    '1':{up:'H10',left:'G11',right:'K11',down:'H14'},
    '2':{up:'Q10',left:'P11',right:'T11',down:'Q14'}
  };
  ['1','2'].forEach(t=>{
    flags[t].forEach(d=>{
      const addr=flagCells[t][d];
      if(addr){
        const c=addr.charCodeAt(0)-65, r=parseInt(addr.slice(1))-1;
        data[r][c]='🚩';
      }
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(data);
  const merges=SD.map(s=>({s:{r:s.excelRow-1,c:s.excelCol.charCodeAt(0)-65},e:{r:s.excelRow,c:s.excelCol.charCodeAt(0)-64}}));
  merges.push({s:{r:10,c:7},e:{r:12,c:9}},{s:{r:10,c:16},e:{r:12,c:18}});
  ws['!merges']=merges;
  ws['!cols']=Array.from({length:24},()=>({wch:9}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'자리배치표');
  const now=new Date();
  const ts=`${now.getMonth()+1}${now.getDate()}_${now.getHours()}${String(now.getMinutes()).padStart(2,'0')}`;
  XLSX.writeFile(wb,`자리배치_${ts}.xlsx`);
  lg(`✔ 엑셀 추출 완료: 자리배치_${ts}.xlsx`,'ok');
}

// ═══════════════════════════════
// 초기화
// ═══════════════════════════════
function resetAll(){
  members=[]; placed={};
  document.getElementById('mlist').innerHTML='';
  document.getElementById('btnA').disabled=true;
  document.getElementById('btnE').disabled=true;
  document.getElementById('gstatus').textContent='멤버 목록을 업로드하세요';
  const uz=document.getElementById('uz');
  uz.querySelector('.ulbl').textContent='멤버 목록 엑셀 업로드';
  uz.style.borderColor='';
  renderGrid(); updStats();
  lg('↺ 초기화','info');
}

// ═══════════════════════════════
// 초기 실행
// ═══════════════════════════════
initDefaultFlags();
renderGrid();
updStats();
</script>
